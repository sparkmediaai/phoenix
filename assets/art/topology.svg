<svg xmlns="http://www.w3.org/2000/svg" id="topology" viewBox="0 0 520 460" role="img" aria-labelledby="topo-title" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
